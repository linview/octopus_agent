[project]
name = "wx-agent"
version = "0.1.0"
description = "微信公众号文章爬取与个性化Agent系统"
authors = [
    {name = "linview", email = "linview@gmail.com"},
]
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.2",
    "requests>=2.31.0",
    "jieba>=0.42.1",
    "pandas>=2.1.3",
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "aiohttp>=3.9.1",
    "pydantic>=2.6.3",
    "pydantic-settings>=2.2.1",
    "pymongo>=4.6.0",
    "chromadb>=0.4.15",
    "sentence-transformers>=2.2.2",
    "snownlp>=0.12.3",
    "accelerate>=0.25.0",
    "aiofiles>=23.2.1",
]
requires-python = ">=3.11, <4.0"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ruff configuration - replaces black, isort, and flake8
[tool.ruff]
# Line length
line-length = 120

# Target Python version
target-version = "py311"

# Formatting configuration
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Code checking configuration
[tool.ruff.lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`) code checking
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "ARG", "SIM", "TID", "Q"]
ignore = [
    "E501",  # Line too long, handled by formatter
    "B008",  # Do not perform function calls in argument defaults
    "C901",  # Function too complex
    "T201",  # Print statement
    "T203",  # Pprint statement
]

# Allow automatic fixes
fixable = ["ALL"]
unfixable = []

# Exclude files
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Force exclude all `__init__.py` files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# isort configuration
[tool.ruff.lint.isort]
known-first-party = ["wx_agent"]
known-third-party = ["pytest", "playwright", "beautifulsoup4", "requests", "jieba", "pandas", "transformers", "torch", "loguru", "aiohttp", "pydantic", "pymongo", "chromadb", "sentence_transformers", "snownlp", "accelerate", "aiofiles"]

# mypy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as asyncio tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
