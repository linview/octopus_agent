[project]
name = "wx-agent"
version = "0.1.0"
description = "微信公众号文章爬取与个性化Agent系统"
authors = [
    {name = "linview", email = "linview@gmail.com"},
]
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.2",
    "requests>=2.31.0",
    "jieba>=0.42.1",
    "pandas>=2.1.3",
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "aiohttp>=3.9.1",
    "pydantic>=2.6.3",
    "pydantic-settings>=2.2.1",
    "pymongo>=4.6.0",
    "chromadb>=0.4.15",
    "sentence-transformers>=2.2.2",
    "snownlp>=0.12.3",
    "accelerate>=0.25.0",
    "aiofiles>=23.2.1",
]
requires-python = ">=3.11, <4.0"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.1"
]

[tool.black]
line-length = 120
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short" 